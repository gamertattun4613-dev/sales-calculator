<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>売上計算アプリ</title>
<style>
:root{--bg:#090d15;--card:#121824;--line:#283345;--text:#f5f7fb;--muted:#9aa5b5;--blue:#3d8cff;--teal:#21c7a8;--purple:#8d6cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:560px;margin:auto;padding:env(safe-area-inset-top) 16px 28px}
header{padding:22px 4px 18px;display:flex;justify-content:space-between;align-items:center}.title{font-size:24px;font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:3px}.gear{background:#151c28;color:#fff;border:1px solid #303a4b;border-radius:14px;width:42px;height:42px;font-size:20px}
.section{margin:10px 0 14px;border:1px solid #222d3d;border-radius:18px;background:var(--card);overflow:hidden}.section-title{padding:13px 15px;font-weight:800}.blue .section-title{background:#152d52}.teal .section-title{background:#103b36}.purple .section-title{background:#2b2050}
.row{display:flex;align-items:center;gap:9px;padding:13px 14px;border-top:1px solid var(--line)}.label{flex:1;font-size:15px;line-height:1.25}.hint{font-size:11px;color:var(--muted);margin-top:3px}input[type=number]{width:105px;background:#202a38;border:1px solid #39465a;border-radius:11px;color:#fff;font-size:19px;text-align:right;padding:9px;outline:none}.unit{width:25px;color:var(--muted);font-size:13px}
.toggle{appearance:none;width:50px;height:29px;border:0;border-radius:20px;background:#46505e;position:relative;flex:none}.toggle:before{content:"";position:absolute;width:23px;height:23px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.toggle:checked{background:var(--blue)}.toggle:checked:before{transform:translateX(21px)}
.calc{width:100%;border:0;border-radius:16px;background:var(--blue);color:#fff;font-weight:800;font-size:18px;padding:16px;margin:8px 0 18px}.result{background:linear-gradient(135deg,#14294b,#101a2a);border:1px solid #294d7d;border-radius:20px;padding:18px;text-align:center}.caption{color:#a9c8f7;font-size:13px}.amount{font-size:36px;font-weight:900;margin-top:5px}.note{color:var(--muted);font-size:11px;text-align:center;margin-top:10px}
</style></head><body><div class="app">
<header><div><div class="title">売上計算アプリ</div><div class="sub">～ あなた専用の売上計算ツール ～</div></div><button class="gear">⚙️</button></header>
<div class="section blue"><div class="section-title">💴 現金（枚数入力）</div>
<div class="row"><div class="label">お札</div><input id="a" type="number" min="0" inputmode="numeric" value="0"><div class="unit">K</div></div>
<div class="row"><div class="label">500円玉</div><input id="b" type="number" min="0" inputmode="numeric" value="0"><div class="unit">枚</div></div>
<div class="row"><div class="label">100円玉</div><input id="c" type="number" min="0" inputmode="numeric" value="0"><div class="unit">枚</div></div></div>
<div class="section teal"><div class="section-title">👤 キャスト関連（金額入力）</div>
<div class="row"><div class="label">未精算キャストの預かり金<div class="hint">未入力の場合は自動で0円</div></div><input id="d" type="number" min="0" inputmode="numeric" placeholder="0"><div class="unit">円</div></div>
<div class="row"><div class="label">精算済みキャストの預かり金</div><input id="e" type="number" min="0" inputmode="numeric" value="0"><div class="unit">円</div></div></div>
<div class="section purple"><div class="section-title">⚙️ 経費・調整（金額入力）</div>
<div class="row"><div class="label">雑費</div><input id="f" type="number" min="0" inputmode="numeric" value="0"><div class="unit">円</div></div>
<div class="row"><div class="label">その他雑費</div><input id="g" type="number" min="0" inputmode="numeric" value="0"><div class="unit">円</div></div>
<div class="row"><div class="label">中締め</div><input id="h" type="number" min="0" inputmode="numeric" value="0"><div class="unit">円</div></div>
<div class="row"><div class="label">キャストバック</div><input id="i" type="number" min="0" inputmode="numeric" value="0"><div class="unit">円</div></div></div>
<div class="section"><div class="section-title">➕ 固定額設定</div>
<div class="row"><div class="label"><b>250,000円を加算</b><div class="hint">必要な時だけON / OFF</div></div><input id="fixed250" class="toggle" type="checkbox" checked></div>
<div class="row"><div class="label">200,000円</div><div class="hint">常に減算</div><div class="unit">−</div></div></div>
<button class="calc" onclick="calc()">🧮 自動計算</button><div id="result" class="result"><div class="caption">現金（預かり金含む）</div><div id="amount" class="amount">¥ 0</div></div>
<div class="note">a×1,000 + b×500 + c×100 + 250,000 + d + e + h + i − (200,000 + f + g)</div>
</div><script>
const ids="abcdefghi".split("");function n(x){let v=parseInt(document.getElementById(x).value,10);return Number.isFinite(v)?v:0}
function calc(){let t=n("a")*1000+n("b")*500+n("c")*100+(document.getElementById("fixed250").checked?250000:0)+n("d")+n("e")+n("h")+n("i")-(200000+n("f")+n("g"));document.getElementById("amount").textContent="¥ "+t.toLocaleString("ja-JP")}
ids.forEach(x=>document.getElementById(x).addEventListener("input",calc));document.getElementById("fixed250").addEventListener("change",calc);calc();
</script></body></html>
