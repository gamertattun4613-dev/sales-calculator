<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>売上計算</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
.wrap{max-width:520px;margin:auto;padding:18px 14px 40px}.title{font-size:24px;font-weight:700;margin:8px 0 18px}
.card{background:#1d1d1f;border-radius:16px;padding:16px;margin-bottom:12px}.card h2{font-size:16px;margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px;margin:9px 0}.label{flex:1;font-size:15px}.unit{width:30px;color:#aaa;font-size:13px}
input{width:125px;background:#2c2c2e;border:1px solid #444;border-radius:10px;color:#fff;padding:12px;font-size:18px;text-align:right}
.result{background:#2b2b2e;border-radius:16px;padding:18px;margin:14px 0}.small{font-size:13px;color:#aaa}.num{font-size:32px;font-weight:800;margin-top:5px}
button{border:0;border-radius:12px;padding:13px 16px;background:#3a3a3c;color:#fff;font-size:15px;margin-right:6px}.primary{background:#fff;color:#111}
.formula{font-size:12px;color:#999;line-height:1.6;margin-top:12px}.history-item{border-top:1px solid #333;padding:12px 0}
.date{font-size:12px;color:#999}.histnum{font-weight:700;margin-top:3px}
</style>
</head>
<body>
<div class="wrap">
<div class="title">売上計算</div>

<div class="card"><h2>現金（枚数入力）</h2>
<div class="row"><div class="label">お札</div><input id="a" type="number" inputmode="numeric" min="0" placeholder="0"><div class="unit">K</div></div>
<div class="row"><div class="label">500円玉</div><input id="b" type="number" inputmode="numeric" min="0" placeholder="0"><div class="unit">枚</div></div>
<div class="row"><div class="label">100円玉</div><input id="c" type="number" inputmode="numeric" min="0" placeholder="0"><div class="unit">枚</div></div></div>

<div class="card"><h2>キャスト関連（金額入力）</h2>
<div class="row"><div class="label">未精算キャストの預かり金</div><input id="d" type="number" inputmode="numeric" min="0" placeholder="0"><div class="unit">円</div></div>
<div class="row"><div class="label">精算済みキャストの預かり金</div><input id="e" type="number" inputmode="numeric" min="0" placeholder="0"><div class="unit">円</div></div>
<div class="row"><div class="label">中締め</div><input id="h" type="number" inputmode="numeric" min="0" placeholder="0"><div class="unit">円</div></div>
<div class="row"><div class="label">キャストバック</div><input id="i" type="number" inputmode="numeric" min="0" placeholder="0"><div class="unit">円</div></div></div>

<div class="card"><h2>経費・調整（金額入力）</h2>
<div class="row"><div class="label">雑費</div><input id="f" type="number" inputmode="numeric" min="0" placeholder="0"><div class="unit">円</div></div>
<div class="row"><div class="label">その他雑費</div><input id="g" type="number" inputmode="numeric" min="0" placeholder="0"><div class="unit">円</div></div></div>

<div class="result"><div class="small">現金（預かり金含む）</div><div class="num" id="result">0円</div></div>
<button class="primary" onclick="saveHistory()">履歴に保存</button>
<button onclick="resetAll()">リセット</button>
<div class="formula">計算式：a×1,000 + b×500 + c×100 + 250,000 + d + e + h + i − (200,000 + f + g)</div>

<div class="card" style="margin-top:18px"><h2>履歴</h2><div id="history"></div><button onclick="clearHistory()">履歴を削除</button></div>
</div>

<script>
const ids=["a","b","c","d","e","f","g","h","i"];
const n=id=>Number(document.getElementById(id).value)||0;
function calc(){
 const total=n("a")*1000+n("b")*500+n("c")*100+250000+n("d")+n("e")+n("h")+n("i")-(200000+n("f")+n("g"));
 document.getElementById("result").textContent=total.toLocaleString("ja-JP")+"円"; return total;
}
ids.forEach(id=>document.getElementById(id).addEventListener("input",calc));
function resetAll(){ids.forEach(id=>document.getElementById(id).value="");calc();}
function saveHistory(){
 const arr=JSON.parse(localStorage.getItem("salesHistory")||"[]");
 arr.unshift({date:new Date().toLocaleString("ja-JP"),total:calc()});
 localStorage.setItem("salesHistory",JSON.stringify(arr.slice(0,30)));renderHistory();
}
function renderHistory(){
 const arr=JSON.parse(localStorage.getItem("salesHistory")||"[]");
 document.getElementById("history").innerHTML=arr.length?arr.map(x=>`<div class="history-item"><div class="date">${x.date}</div><div class="histnum">${Number(x.total).toLocaleString("ja-JP")}円</div></div>`).join(""):"<div style='color:#888;font-size:13px'>履歴はありません</div>";
}
function clearHistory(){if(confirm("履歴をすべて削除しますか？")){localStorage.removeItem("salesHistory");renderHistory();}}
renderHistory();calc();
</script>
</body>
</html>
